<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shrinkr</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Shrinkr</h1>
      <p>Turn long URLs into short, shareable links.</p>
      <form id="shorten-form">
        <label for="url">Long URL</label>
        <input id="url" name="url" type="url" placeholder="https://example.com/long-link" required />

        <label for="alias">Custom alias (optional)</label>
        <input id="alias" name="alias" placeholder="my-link" maxlength="32" />

        <button type="submit">Create short link</button>
      </form>
      <p id="result" aria-live="polite"></p>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
